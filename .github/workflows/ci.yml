name: CI

on:
  # 'feat/**' ikut supaya PR di TENGAH stack juga mendapat CI. Tanpa itu hanya PR
  # paling bawah (yang menargetkan main) yang diuji, dan checklist
  # .github/pull_request_template.md tidak bisa dipenuhi otomatis.
  pull_request:
    branches: [main, 'feat/**']

env:
  NODE_VERSION: "22"

jobs:
  lint-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      # Verifikasi ID token Identity Platform (B-27). Tanpa DB dan tanpa
      # jaringan: skrip membuat sertifikat penandatangan sendiri lalu
      # membuktikan token cacat DITOLAK. Ditaruh di job ini, bukan di db-verify,
      # karena tidak menyentuh Postgres sama sekali.
      - run: npm run auth:verify

      # DATABASE_URL/SESSION_SECRET di sini nilai dummy khusus build, sama seperti
      # Dockerfile -- next build meng-import halaman, dan koneksi DB dibuat saat
      # modul di-import, tapi build tidak konek DB sungguhan.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
          SESSION_SECRET: build_time_only_placeholder_min_32_chars_0000

  db-verify:
    name: Migrate, bootstrap, verify DB
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: agrovision
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrovision"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Skrip db:* memakai `node --env-file=.env.local`; file itu wajib ada
      # (boleh kosong) supaya flag tidak error. Nilai env sungguhan disuntikkan
      # lewat `env:` di tiap step, bukan lewat isi file ini.
      - run: touch .env.local

      - name: Migrate
        run: npm run db:migrate
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:dev@localhost:55433/agrovision

      # Password app_user WAJIB "apppass" -- itu yang di-hardcode
      # db/verify.mjs & db/verify-adversarial.mjs sebagai koneksi APP.
      - name: Bootstrap app role
        run: npm run db:bootstrap
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:dev@localhost:55433/agrovision
          APP_DB_USER: app_user
          APP_DB_PASSWORD: apppass

      - name: DB verify suite
        run: npm run db:test

      - name: DB adversarial suite
        run: npm run db:test:adversarial
